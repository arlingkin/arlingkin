name: Update Profile Metrics

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - 'github-metrics.svg'

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: arlingkin
          template: classic
          base: header, activity, community, repositories, metadata
          
          # Calendar Plugin
          plugin_calendar: yes
          plugin_calendar_limit: 1
          
          # Languages Plugin
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          
          # Lines Plugin
          plugin_lines: yes
          
          # Repositories Plugin - Enhanced Configuration
          plugin_repositories: yes
          plugin_repositories_limit: 10                    # Number of repos to display (default: 6)
          plugin_repositories_order: stargazers           # Sort by: stargazers, forks, updated, featured
          plugin_repositories_starred: yes                # Show starred repos
          plugin_repositories_featured: arlingkin/arlingkin  # Highlight specific repos
          
          # Optional: Exclude certain repos
          plugin_repositories_exclude: archived, fork     # Exclude: archived, fork, source
          
          config_timezone: Asia/Jakarta
          filename: github-metrics.svg

      - name: Purge jsDelivr cache
        run: curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/github-metrics.svg" || true
